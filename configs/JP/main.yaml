      - [0xCAE58, c, fieldfx/emitters]
      - [0xCFDE0, c, fieldfx/vector]
      - [0xD0278, c, fieldfx/angle]
      # The engine's initialised data (with three unreferenced code fragments
      # at its start), then its zero-initialised data. Both are labelled blobs
      # inside the image and move with the engine.
      - [0xD0320, data, engine/engine_data_800DFB20]
      - [0xD2468, data, engine/engine_bss_800E1C68]
      # Boot_InitMemoryLayout's work area: buffers carved at constant offsets
      # (0x1800, 0x6000, 0x14000) from the engine's end up to the first overlay
      # window. It moves with the engine; ld_postpass.py asserts that it still
      # ends at or before the window (docs/SHIFTABILITY_PLAN.md 3.4).
      - [0xE37B8, data, engine/boot_work_area]

  # Overlay load windows and the runtime buffers that share them, from the
  # mdec_diag window up to the end of the image. The block floats as a unit:
  # it follows the boot work area (vram_symbol), the windows are offsets from
  # its start (linkers/JP/overlay_windows.txt) and the overlays link at those
  # offsets from the built main. vram stays for the retail disassembly;
  # tools/scripts/ld_postpass.py fails the link when the image reaches the
  # initial stack.
  - name: overlay_windows
    type: code
    start: 0xFBFB8
    vram: 0x8010B7B8
    vram_symbol: field_engine_VRAM_END
    align: 4
    subalign: 4
    bss_size: 0x0
    subsegments:
