  # The field engine starts at retail's `_end` (0x800C1B88, where the
  # startup's BSS clear stops and the heap begins): the zeros before it are
  # the tail of main's large COMMON pool. Keep a separate linker segment so
  # section ordering preserves retail addresses. The link places it after
  # main (vram_symbol); vram stays for the retail disassembly.
  - name: field_engine
    type: code
    start: 0xB2388
    vram: 0x800C1B88
    vram_symbol: main_VRAM_END
    align: 4
    subalign: 4
    bss_size: 0x0
    subsegments:
      - [0xB2388, rodata, engine/engine_800C1B88]
      - [0xB23E8, .rodata, fieldfx/sprite_render]
      - [0xB23FC, rodata, engine/engine_800C1BFC]
      - [0xB2564, .rodata, fieldfx/geometry]
