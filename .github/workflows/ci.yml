name: ci

# decomp.dev only reads workflow runs on the default branch triggered by a
# push, and only artifacts named <version>_report. Everything else here exists
# so that the report always measures a real build of every shipped binary.
on:
  push:
  pull_request:

jobs:
  source-only:
    runs-on: ubuntu-24.04
    env:
      PE_CPP: ${{ github.workspace }}/tools/old-gcc/cpp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Layout tests compile small PSX translation units. They need the same
      # compiler pipeline as the full build, but do not need retail assets.
      - name: Install cross binutils
        run: |
          # Binutils comes from Ubuntu; unrelated preinstalled vendor feeds
          # must not block the build when their package indexes are inconsistent.
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y binutils-mipsel-linux-gnu
          for tool in as ld nm objcopy objdump readelf; do
            sudo ln -sf "/usr/bin/mipsel-linux-gnu-$tool" "/usr/local/bin/mipsel-none-elf-$tool"
          done

      - name: Cache native GAS 2.7
        uses: actions/cache@v4
        with:
          path: tools/gas-2.7
          key: gas27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/scripts/setup_gas27.sh') }}

      - name: Install the PSX compiler and assemblers
        run: |
          tools/scripts/setup_stock_cc1.sh
          tools/scripts/setup_stock_cc281.sh
          tools/scripts/setup_maspsx.sh
          tools/scripts/setup_gas27.sh

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run source-only checks
        run: make ci

  build-and-report:
    # Forks have no access to the assets repository; skipping keeps their
    # first push green instead of red.
    if: github.repository == 'khasinski/parasite-eve-decomp'
    runs-on: ubuntu-24.04
    env:
      PE_CPP: ${{ github.workspace }}/tools/old-gcc/cpp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # The build hard-codes the mipsel-none-elf-* binutils names; Ubuntu
      # ships the same binaries as mipsel-linux-gnu-*.
      - name: Install cross binutils
        run: |
          # Binutils comes from Ubuntu; unrelated preinstalled vendor feeds
          # must not block the build when their package indexes are inconsistent.
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y binutils-mipsel-linux-gnu
          for tool in as ld nm objcopy objdump readelf; do
            sudo ln -sf "/usr/bin/mipsel-linux-gnu-$tool" "/usr/local/bin/mipsel-none-elf-$tool"
          done

      - name: Cache native GAS 2.7
        uses: actions/cache@v4
        with:
          path: tools/gas-2.7
          key: gas27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/scripts/setup_gas27.sh') }}

      - name: Install the PSX compiler and assemblers
        run: |
          tools/scripts/setup_stock_cc1.sh
          tools/scripts/setup_stock_cc281.sh
          tools/scripts/setup_maspsx.sh
          tools/scripts/setup_gas27.sh
          tools/scripts/setup_objdiff.sh

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Fetch the retail binaries
        uses: actions/checkout@v4
        with:
          repository: khasinski/parasite-eve-assets
          ssh-key: ${{ secrets.ASSETS_SSH_KEY }}
          path: .assets

      - name: Place them where the build expects
        run: |
          mkdir -p assets/USA original/USA
          cp .assets/assets/USA/main.exe assets/USA/
          cp -R .assets/original/USA/overlays original/USA/overlays
          rm -rf .assets

      # Overlay splitting and compilation dominate the workflow. Main-only
      # decompilation changes do not affect these products, so retain their
      # objects, linker maps and generated assembly under an input hash that
      # covers every shared file that can change their bytes.
      - name: Restore overlay build
        id: overlay-cache
        uses: actions/cache@v4
        with:
          path: |
            asm/USA/overlays
            build/USA/overlays
            linkers/USA/overlays
          key: overlays-v2-${{ hashFiles('configs/USA/overlays/**', 'configs/USA/sym.main.txt', 'src/overlays/**', 'include/**', 'tools/m2c/**', 'tools/scripts/cc.sh', 'tools/scripts/overlay_extra_undefineds.py', 'tools/scripts/parallel_overlay_make.py', 'Makefile', 'requirements.txt') }}
          restore-keys: |
            overlays-v2-

      - name: Split and build the main executable
        run: |
          make split
          make -j"$(nproc)" build

      - name: Verify the main executable against the retail SHA-1
        run: make check

      - name: Build every overlay
        if: steps.overlay-cache.outputs.cache-hit != 'true'
        run: make overlay-build-all OVERLAY_JOBS="$(nproc)"

      - name: Verify the overlays against the retail SHA-1s
        run: make overlay-check-all

      - name: Generate the target objects and the progress report
        run: make report

      - name: Verify README badges match the audited report
        run: |
          make progress
          make debt
          git diff --exit-code -- docs/badges

      - name: Publish the progress report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SLUS_006.62_report
          path: build/USA/report.json
          if-no-files-found: error
